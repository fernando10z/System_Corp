# =============================================================================
# MIP · entorno de desarrollo
#
# Los puertos están remapeados a propósito para no chocar con otros servicios
# del equipo (System_ERP y demás usan los de por defecto y algunos remapeados):
#   postgres  localhost:5436   redis  localhost:6383
#   minio     localhost:9110 (API) / 9111 (consola)
#
# Primer arranque:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#   bash db/scripts/apply-migrations.sh
#
# Reinicio limpio:
#   ALLOW_RESET=yes bash db/scripts/reset-dev.sh
# =============================================================================
name: mip

services:
  postgres:
    image: postgres:16-alpine
    container_name: mip_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mip_dev
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "5436:5432"
    volumes:
      - mip_postgres_data_dev:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mip_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mip_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6383:6379"
    volumes:
      - mip_redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mip_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9110:9000"
      - "9111:9001"
    volumes:
      - mip_minio_data_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Crea el bucket de adjuntos una sola vez y termina.
  minio-init:
    image: minio/mc:latest
    container_name: mip_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mip-adjuntos &&
      echo 'bucket mip-adjuntos listo'
      "

volumes:
  mip_postgres_data_dev:
  mip_redis_data_dev:
  mip_minio_data_dev:
