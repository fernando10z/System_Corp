server {
    listen 443 ssl http2;
    server_name app.mip.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.mip.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mip.example.com/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    root /srv/mip/repo/System_Corp/frontend/dist;
    index index.html;

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NUNCA se cachea: es lo que apunta a los assets nuevos tras un
    # despliegue. Cachearlo deja a los usuarios en la versión anterior.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA: cualquier ruta la resuelve vue-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name app.mip.example.com;
    return 301 https://$host$request_uri;
}
