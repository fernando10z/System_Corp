server {
    listen 443 ssl http2;
    server_name api.mip.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.mip.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mip.example.com/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    # Los adjuntos pueden llegar a 100 MB (vídeo, cap. 28.3). Debe ir alineado
    # con BODY_LIMIT_BYTES del backend, o nginx cortará antes que la aplicación
    # y el usuario verá un 413 sin explicación.
    client_max_body_size 110M;

    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Se propaga el identificador de petición para poder cruzar el log de
        # nginx con audit_log.request_id.
        proxy_set_header X-Request-Id      $request_id;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name api.mip.example.com;
    return 301 https://$host$request_uri;
}
